plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${rootProject.archives_base_name}-fabric"
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

	// Config screen. Cloth Config brings its own Fabric API bundle, so exclude it.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu supplies the "Mods" screen button. Optional at runtime.
	implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}
