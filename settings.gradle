pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'faster-happy-ghast'

// `common` is a plain shared source directory, not a Gradle project. Minecraft 26.2 ships
// unobfuscated, so both loaders see identical class names and the shared sources need no
// remapping transform between platforms.
include 'fabric'
include 'neoforge'
